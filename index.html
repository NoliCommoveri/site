<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Immotus</title>
<meta name="description" content="Immotus — simple apps to help families do more, together.">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --text: #2b2620;
    --accent: #b5764a;
    --muted: #6b6258;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
  }
  .card {
    max-width: 480px;
  }
  .logo {
    font-size: 2.5rem;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin-bottom: 0.5rem;
    color: var(--accent);
  }
  .tagline {
    font-size: 1.15rem;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }
  .status {
    display: inline-block;
    font-size: 0.85rem;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    color: var(--muted);
    border: 1px solid var(--muted);
    border-radius: 999px;
    padding: 0.35rem 0.9rem;
    margin-bottom: 1.5rem;
  }
  .blurb {
    font-size: 0.95rem;
    color: var(--muted);
    line-height: 1.6;
  }
  a.contact {
    color: var(--accent);
    text-decoration: none;
    font-weight: 600;
  }
  a.contact:hover {
    text-decoration: underline;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">Immotus</div>
    <div class="status">Coming soon</div>
    <p class="tagline">Simple apps built to make everyday family life a little easier.</p>
    <p class="blurb">
      We're just getting started here.<br>
      In the meantime, feel free to reach out at
      <a class="contact" href="mailto:raycarson13@gmail.com">raycarson13@gmail.com</a>.
    </p>
  </div>
</body>
</html>
