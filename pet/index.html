<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Immotus Pet — Prototype</title>
<meta name="theme-color" content="#faf7f2">
<style>
  :root {
    color-scheme: light dark;
    --bg: #faf7f2;
    --text: #2b2620;
    --accent: #b5764a;
    --muted: #6b6258;
    --card: #ffffff;
    --bar-track: #e7e0d6;
    --hunger: #e08a4b;
    --happiness: #e0b34b;
    --energy: #4ba3e0;
    --cleanliness: #4bc7a8;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 1.5rem 1rem 3rem;
  }
  .app {
    width: 100%;
    max-width: 420px;
  }
  .name-row {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  h1 {
    font-size: 1.4rem;
    margin: 0;
    letter-spacing: -0.01em;
  }
  .rename-btn {
    background: none;
    border: none;
    font-size: 1rem;
    cursor: pointer;
    color: var(--muted);
    padding: 0.25rem;
  }
  .rename-form {
    display: none;
    gap: 0.5rem;
    margin-bottom: 0.75rem;
  }
  .rename-form.visible { display: flex; }
  .rename-form input {
    flex: 1;
    padding: 0.6rem 0.8rem;
    border-radius: 10px;
    border: 1px solid var(--bar-track);
    font-size: 1rem;
  }
  .rename-form button {
    padding: 0.6rem 1rem;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: white;
    font-weight: 600;
  }

  .species-picker {
    display: none;
    text-align: center;
    padding: 1rem 0 0.5rem;
  }
  .picker-title {
    margin-bottom: 0.35rem;
  }
  .picker-hint {
    margin: 0 0 1rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  .app-body { display: none; }

  .species-row {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }

  .variant-row {
    display: none;
    justify-content: center;
    gap: 0.5rem;
    margin: 0.6rem 0 0.25rem;
  }
  .variant-row.visible { display: flex; }
  .variant-btn {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid var(--bar-track);
    cursor: pointer;
    padding: 0;
    background: var(--swatch, var(--card));
  }
  .variant-btn.active {
    border-color: var(--accent);
    box-shadow: 0 0 0 2px var(--accent) inset;
  }
  .variant-btn.variant-base {
    background: var(--card);
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1;
  }
  .species-btn {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    padding: 0.5rem 0.9rem;
    border-radius: 999px;
    border: 2px solid var(--bar-track);
    background: var(--card);
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
  }
  .species-btn .emoji { font-size: 1.1rem; }
  .species-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    background: #fbf0e8;
  }

  .stage {
    background: linear-gradient(180deg, #cdeaf7 0%, #eaf6ee 100%);
    border-radius: 24px;
    padding: 1.5rem 1rem 1rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    position: relative;
    overflow: hidden;
  }

  .pet-visual {
    display: none;
    width: 70%;
    max-width: 220px;
    margin: 0 auto;
    animation: bob 2.6s ease-in-out infinite;
  }
  #pet-sprite { object-fit: contain; filter: drop-shadow(0 6px 6px rgba(0,0,0,0.12)); }
  /* Added by JS once a sprite loads at <=128px wide, i.e. it's conforming
     128x128 pixel art being upscaled to the 220px stage. Legacy 471-640px
     stills fall outside the threshold and keep smooth downscaling. */
  #pet-sprite.pixel-art { image-rendering: pixelated; }
  .species-blob #pet-svg { display: block; }
  .species-trex #pet-sprite,
  .species-unicorn #pet-sprite,
  .species-hippocampus #pet-sprite,
  .species-pegasus #pet-sprite,
  .species-phoenix #pet-sprite,
  .species-griffin #pet-sprite,
  .species-dragon #pet-sprite { display: block; }
  /* Idle-bob rate reads as breathing, so it applies to real pose art too. */
  .mood-happy .pet-visual { animation-duration: 1.3s; }
  .mood-sleeping .pet-visual { animation: bob 4.5s ease-in-out infinite; }
  /* Everything below only runs when we had to fall back to the idle sprite
     for this mood — a real sad/sleep pose must not also get droop-rotated
     and desaturated on top of what the artist already drew. */
  .pose-fallback.mood-sad .pet-visual { animation: droop-bob 3.4s ease-in-out infinite; }
  .pose-fallback.mood-sleeping .pet-visual { opacity: 0.92; }

  @keyframes bob {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }
  @keyframes droop-bob {
    0%, 100% { transform: translateY(4px) rotate(0deg); }
    50% { transform: translateY(8px) rotate(-1.5deg); }
  }

  .eye { transform-origin: center; animation: blink 4.2s ease-in-out infinite; }
  .mood-sleeping .eye-open, .mood-sleeping .eye-highlight { display: none; }
  .eye-closed { display: none; }
  .mood-sleeping .eye-closed { display: block; }

  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.1); }
  }

  .mouth { display: none; }
  .mouth-neutral { display: block; }
  .mood-happy .mouth-neutral, .mood-sad .mouth-neutral, .mood-sleeping .mouth-neutral { display: none; }
  .mood-happy .mouth-happy { display: block; }
  .mood-sad .mouth-sad { display: block; }
  .mood-sleeping .mouth-sleeping { display: block; }

  .body-shape { fill: url(#bodyGradient); transition: filter 0.4s ease; }
  /* #pet-sprite in the selector because the ID rule above sets `filter` for
     the drop shadow, and a bare .mood-sad .pet-visual loses to it — which is
     why raster species never actually desaturated when sad. */
  .pose-fallback.mood-sad #pet-svg.pet-visual,
  .pose-fallback.mood-sad #pet-sprite.pet-visual {
    filter: grayscale(35%) brightness(0.95) drop-shadow(0 6px 6px rgba(0,0,0,0.12));
  }

  .accessory { display: none; }
  .species-blob .accessory-blob { display: block; }

  .overlay-dirt {
    position: absolute;
    width: 20px;
    height: 12px;
    background: #8a6a45;
    opacity: 0.55;
    border-radius: 50%;
    display: none;
    pointer-events: none;
  }
  .dirty .overlay-dirt { display: block; }

  .zzz {
    position: absolute;
    left: 70%;
    top: 22%;
    font-size: 20px;
    color: #6b6258;
    display: none;
    pointer-events: none;
  }
  .mood-sleeping .zzz { display: block; animation: float-up 2.4s ease-in-out infinite; }
  @keyframes float-up {
    0% { transform: translate(0, 0); opacity: 0; }
    20% { opacity: 1; }
    100% { transform: translate(10px, -22px); opacity: 0; }
  }

  .sparkle {
    position: absolute;
    font-size: 18px;
    display: none;
    pointer-events: none;
  }
  .mood-happy .sparkle { display: block; animation: sparkle-pop 1.3s ease-in-out infinite; }
  @keyframes sparkle-pop {
    0%, 100% { opacity: 0; transform: scale(0.6); }
    50% { opacity: 1; transform: scale(1); }
  }

  .action-flash { animation: flash-pop 0.5s ease; }
  @keyframes flash-pop {
    0% { transform: scale(1); }
    35% { transform: scale(1.12); }
    100% { transform: scale(1); }
  }

  .status {
    text-align: center;
    font-size: 0.95rem;
    color: var(--muted);
    margin: 0.75rem 0 0.25rem;
    min-height: 1.3em;
  }

  .stats {
    margin-top: 1rem;
    display: grid;
    gap: 0.6rem;
  }
  .stat-row {
    display: grid;
    grid-template-columns: 1.6rem 1fr 2.5rem;
    align-items: center;
    gap: 0.6rem;
    font-size: 0.9rem;
  }
  .stat-icon { text-align: center; }
  .bar-track {
    background: var(--bar-track);
    border-radius: 999px;
    height: 10px;
    overflow: hidden;
  }
  .bar-fill {
    display: block;
    height: 100%;
    border-radius: 999px;
    transition: width 0.5s ease;
  }
  .stat-value { text-align: right; color: var(--muted); }

  .actions {
    margin-top: 1.25rem;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 0.75rem;
  }
  button.action {
    min-height: 64px;
    border: none;
    border-radius: 16px;
    background: var(--accent);
    color: white;
    font-size: 1rem;
    font-weight: 600;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.5rem;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button.action:active { transform: scale(0.97); }
  button.action:disabled {
    background: var(--bar-track);
    color: var(--muted);
    cursor: not-allowed;
  }
  button.action .emoji { font-size: 1.3rem; }

  .note {
    text-align: center;
    font-size: 0.78rem;
    color: var(--muted);
    margin-top: 1.25rem;
  }
</style>
</head>
<body>
  <div class="app">
    <div class="species-picker" id="species-picker">
      <h1 class="picker-title">Choose your pet!</h1>
      <p class="picker-hint">Pick carefully — this is who you'll be raising.</p>
      <div class="species-row" id="species-row">
        <button class="species-btn" data-species="blob"><span class="emoji">🟢</span> Slime</button>
        <button class="species-btn" data-species="trex"><span class="emoji">🦖</span> T-Rex</button>
        <button class="species-btn" data-species="unicorn"><span class="emoji">🦄</span> Unicorn</button>
        <button class="species-btn" data-species="pegasus"><span class="emoji">🪽</span> Pegasus</button>
        <button class="species-btn" data-species="hippocampus"><span class="emoji">🌊</span> Hippocampus</button>
        <button class="species-btn" data-species="phoenix"><span class="emoji">🔥</span> Phoenix</button>
        <button class="species-btn" data-species="griffin"><span class="emoji">🦅</span> Griffin</button>
        <button class="species-btn" data-species="dragon"><span class="emoji">🐉</span> Dragon</button>
      </div>
    </div>

    <div class="app-body" id="app-body">
    <div class="name-row">
      <h1 id="pet-name-display">Widget</h1>
      <button class="rename-btn" id="rename-toggle" aria-label="Rename pet">✏️</button>
    </div>
    <form class="rename-form" id="rename-form">
      <input type="text" id="rename-input" maxlength="16" placeholder="Pet's name">
      <button type="submit">Save</button>
    </form>

    <div class="stage" id="stage">
      <svg id="pet-svg" class="pet-visual" viewBox="0 0 200 210" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="bodyGradient" cx="35%" cy="30%" r="75%">
            <stop offset="0%" stop-color="#c8f2e0"/>
            <stop offset="100%" stop-color="#5fb8a6"/>
          </radialGradient>
        </defs>

        <!-- blob accessories -->
        <g class="accessory accessory-blob">
          <line x1="75" y1="35" x2="65" y2="10" stroke="#5fb8a6" stroke-width="4" stroke-linecap="round"/>
          <circle cx="65" cy="10" r="5" fill="#f4a6c1"/>
          <line x1="125" y1="35" x2="135" y2="10" stroke="#5fb8a6" stroke-width="4" stroke-linecap="round"/>
          <circle cx="135" cy="10" r="5" fill="#f4a6c1"/>
        </g>

        <!-- body -->
        <path class="body-shape" d="M100,25 C150,25 178,65 178,112 C178,162 143,190 100,190 C57,190 22,162 22,112 C22,65 50,25 100,25 Z"/>

        <!-- cheeks -->
        <ellipse cx="60" cy="120" rx="12" ry="8" fill="#ffb6c1" opacity="0.6"/>
        <ellipse cx="140" cy="120" rx="12" ry="8" fill="#ffb6c1" opacity="0.6"/>

        <!-- eyes -->
        <g class="eye eye-open">
          <circle cx="78" cy="100" r="9" fill="#2b2620"/>
          <circle cx="122" cy="100" r="9" fill="#2b2620"/>
          <circle class="eye-highlight" cx="81" cy="97" r="2.5" fill="#fff"/>
          <circle class="eye-highlight" cx="125" cy="97" r="2.5" fill="#fff"/>
        </g>
        <g class="eye-closed">
          <path d="M70,100 Q78,106 86,100" stroke="#2b2620" stroke-width="3" fill="none" stroke-linecap="round"/>
          <path d="M114,100 Q122,106 130,100" stroke="#2b2620" stroke-width="3" fill="none" stroke-linecap="round"/>
        </g>

        <!-- mouths -->
        <path class="mouth mouth-neutral" d="M90,128 Q100,133 110,128" stroke="#2b2620" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="mouth mouth-happy" d="M84,124 Q100,144 116,124" stroke="#2b2620" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="mouth mouth-sad" d="M86,134 Q100,120 114,134" stroke="#2b2620" stroke-width="3" fill="none" stroke-linecap="round"/>
        <path class="mouth mouth-sleeping" d="M92,128 Q100,131 108,128" stroke="#2b2620" stroke-width="3" fill="none" stroke-linecap="round"/>
      </svg>

      <img id="pet-sprite" class="pet-visual" alt="">

      <div class="overlay-dirt" style="left: 34%; top: 76%;"></div>
      <div class="overlay-dirt" style="left: 58%; top: 80%;"></div>
      <span class="sparkle" style="left: 15%; top: 30%;">✨</span>
      <span class="sparkle" style="left: 72%; top: 22%;">✨</span>
      <span class="zzz">Z</span>
    </div>

    <div class="variant-row" id="variant-row"></div>

    <p class="status" id="status-text"></p>

    <div class="stats">
      <div class="stat-row">
        <span class="stat-icon">🍎</span>
        <span class="bar-track"><span class="bar-fill" id="bar-hunger" style="background: var(--hunger);"></span></span>
        <span class="stat-value" id="val-hunger">–</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">😊</span>
        <span class="bar-track"><span class="bar-fill" id="bar-happiness" style="background: var(--happiness);"></span></span>
        <span class="stat-value" id="val-happiness">–</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">⚡</span>
        <span class="bar-track"><span class="bar-fill" id="bar-energy" style="background: var(--energy);"></span></span>
        <span class="stat-value" id="val-energy">–</span>
      </div>
      <div class="stat-row">
        <span class="stat-icon">🧼</span>
        <span class="bar-track"><span class="bar-fill" id="bar-cleanliness" style="background: var(--cleanliness);"></span></span>
        <span class="stat-value" id="val-cleanliness">–</span>
      </div>
    </div>

    <div class="actions">
      <button class="action" id="btn-feed"><span class="emoji">🍎</span> Feed</button>
      <button class="action" id="btn-play"><span class="emoji">🎾</span> Play</button>
      <button class="action" id="btn-clean"><span class="emoji">🧼</span> Clean</button>
      <button class="action" id="btn-sleep"><span class="emoji">🌙</span> <span id="sleep-label">Sleep</span></button>
    </div>

    <p class="note">Your pet's care is saved on this device.</p>
    </div>
  </div>

<script>
(function () {
  var STORAGE_KEY = 'immotus-pet-v1';

  // Points lost per real hour while awake; sleep pauses/slows most of these
  // so a nap is a deliberate way to protect stats, not free healing.
  var DECAY_PER_HOUR = { hunger: 18, happiness: 12, cleanliness: 9, energy: 8 };
  var SLEEP_ENERGY_REGEN_PER_HOUR = 30;

  function clamp(v) { return Math.max(0, Math.min(100, v)); }

  function defaultState() {
    return {
      name: null,
      // Chosen once at launch and then locked — see SPEC.md "Species
      // selection" for the future points-gated switching plan.
      species: null,
      // 'base' = the art's original ship colors. See COLOR_VARIANTS below —
      // only species listed there offer anything else.
      colorVariant: 'base',
      hunger: 80,
      happiness: 80,
      energy: 80,
      cleanliness: 80,
      sleeping: false,
      lastUpdated: Date.now()
    };
  }

  function loadState() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      var parsed = JSON.parse(raw);
      return Object.assign(defaultState(), parsed);
    } catch (e) {
      return defaultState();
    }
  }

  function saveState() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function applyDecay(s) {
    var now = Date.now();
    var hours = (now - s.lastUpdated) / 3600000;
    if (hours <= 0) return s;

    if (s.sleeping) {
      s.energy = clamp(s.energy + hours * SLEEP_ENERGY_REGEN_PER_HOUR);
      s.hunger = clamp(s.hunger - hours * DECAY_PER_HOUR.hunger * 0.5);
      s.cleanliness = clamp(s.cleanliness - hours * DECAY_PER_HOUR.cleanliness * 0.3);
    } else {
      s.hunger = clamp(s.hunger - hours * DECAY_PER_HOUR.hunger);
      s.happiness = clamp(s.happiness - hours * DECAY_PER_HOUR.happiness);
      s.cleanliness = clamp(s.cleanliness - hours * DECAY_PER_HOUR.cleanliness);
      s.energy = clamp(s.energy - hours * DECAY_PER_HOUR.energy);
    }
    s.lastUpdated = now;
    return s;
  }

  function getMood(s) {
    if (s.sleeping) return 'sleeping';
    var min = Math.min(s.hunger, s.happiness, s.energy);
    if (min < 20) return 'sad';
    var avg = (s.hunger + s.happiness + s.energy + s.cleanliness) / 4;
    if (avg >= 70) return 'happy';
    return 'neutral';
  }

  var STATUS_MESSAGES = {
    sleeping: 'Zzz... sleeping soundly.',
    sad: 'Needs some care!',
    happy: 'Feeling great!',
    neutral: 'Doing okay.'
  };

  // --- Pose art -----------------------------------------------------------
  //
  // Each mood/action maps to its own drawn sprite rather than a CSS filter
  // over one still. See SPEC.md "Pose set" for what each pose depicts and the
  // file-naming rule (`assets/<species>-<pose>.png`; idle keeps the bare
  // `assets/<species>.png` name it shipped with).
  //
  // Only list files that actually exist — a missing entry degrades down
  // POSE_FALLBACK instead of 404ing into a broken image icon.
  var SPECIES_POSES = {
    trex: {
      idle: 'assets/trex.png',
      happy: 'assets/trex-happy.png',
      sad: 'assets/trex-sad.png',
      sleep: 'assets/trex-sleep.png'
    },
    unicorn: {
      idle: 'assets/unicorn.png',
      happy: 'assets/unicorn-happy.png',
      sad: 'assets/unicorn-sad.png',
      sleep: 'assets/unicorn-sleep.png'
    },
    pegasus: {
      idle: 'assets/pegasus.png',
      happy: 'assets/pegasus-happy.png',
      sad: 'assets/pegasus-sad.png',
      sleep: 'assets/pegasus-sleep.png'
    },
    hippocampus: {
      idle: 'assets/hippocampus.png',
      happy: 'assets/hippocampus-happy.png',
      sad: 'assets/hippocampus-sad.png',
      sleep: 'assets/hippocampus-sleep.png'
    },
    phoenix: { idle: 'assets/phoenix.png' },
    griffin: { idle: 'assets/griffin.png' },
    dragon: {
      idle: 'assets/dragon.png',
      happy: 'assets/dragon-happy.png',
      sad: 'assets/dragon-sad.png',
      sleep: 'assets/dragon-sleep.png'
    }
  };

  // Where each pose degrades to when its art hasn't been drawn yet. Every
  // chain has to terminate at idle, which is the one pose a species may not
  // ship without.
  var POSE_FALLBACK = {
    idle: null,
    happy: 'idle',
    sad: 'idle',
    sleep: 'idle',
    eat: 'happy',
    play: 'happy',
    bath: 'idle'
  };

  var MOOD_POSES = {
    happy: 'happy',
    neutral: 'idle',
    sad: 'sad',
    sleeping: 'sleep'
  };

  var POSE_MOODS = { happy: 'happy', idle: 'neutral', sad: 'sad', sleep: 'sleeping' };

  var POSE_ALT = {
    idle: '',
    happy: ', looking delighted',
    sad: ', looking sad',
    sleep: ', asleep',
    eat: ', eating',
    play: ', playing',
    bath: ', having a bath'
  };

  // How long an action pose holds before falling back to the mood pose.
  var ACTION_POSE_MS = 1800;
  var ACTION_POSES = { feed: 'eat', play: 'play', clean: 'bath' };

  // Walks the fallback chain and reports whether it landed on the pose we
  // actually wanted, so the CSS can tell "real art" from "faked with filters".
  function resolvePose(species, wanted) {
    var set = SPECIES_POSES[species];
    // Species with no raster art at all (blob) is drawn by the inline SVG,
    // which does swap real eye/mouth shapes per mood — so it counts as exact.
    if (!set) return { pose: wanted, src: null, exact: true };
    var name = wanted;
    while (name && !set[name]) name = POSE_FALLBACK[name];
    if (!name) return { pose: 'idle', src: set.idle || null, exact: false };
    return { pose: name, src: set[name], exact: name === wanted };
  }

  // --- Color variants ------------------------------------------------------
  //
  // Test case for SPEC.md §5 "Color/variation at species selection": a
  // hue-rotate filter was tried and rejected there because it shifts every
  // pixel, including parts that shouldn't move with the primary body color
  // (the unicorn's gold hooves/horn shifting with its mane). Instead each
  // variant is a small { source hex -> replacement hex } map covering only
  // the palette entries that make up the primary body color, remapped on an
  // offscreen canvas and cached — the tan/cream belly and every other
  // palette entry pass through untouched.
  //
  // T-Rex was the trial species. Its 20-color palette
  // (reference/trex-palette.txt) splits cleanly into a 7-color green
  // body/outline ramp and a 13-color tan/cream belly ramp; each variant
  // below remaps just the green ramp, hue-rotated to a new hue at matching
  // lightness/saturation so the value steps (shadow → highlight) stay
  // intact and the belly/teeth/mouth interior pass through untouched.
  //
  // Unicorn is a different shape of the same problem: its whole 20-color
  // palette (reference/unicorn-palette.txt) is one hue family (H 323–342,
  // pink) at varying lightness/saturation — mane, body, and hooves are all
  // shades of pink on this asset, not a separate protected accent hue like
  // T-Rex's belly. So the variant map below covers the *entire* palette,
  // hue-rotated as a block; there's nothing that needs to be left alone.
  //
  // Dragon and pegasus are unicorn's shape (one hue family, full-palette
  // remap) but wider: dragon's 19 colors span H 210–280 (blue highlight
  // through purple body, the "purple-on-blue" pair from SPEC.md), and
  // pegasus's 20 span H 19–43 (near-black outline through golden-tan
  // through flaxen-cream). Mapping every color to one fixed target hue
  // (like unicorn's) would have flattened that spread — the blue highlight
  // and purple body would end up the same hue, losing the two-tone read.
  // So these two use a constant hue-rotation *delta* applied to every
  // source color instead of a fixed target, which preserves the original
  // spread (and hence the two-tone character) under the new hue.
  //
  // Hippocampus reverts to T-Rex's split shape: per SPEC.md it has two body
  // hues, not one — an actual white (3 near-white highlight colors, all
  // L≥0.95) plus a teal ramp (the other 7, L 0.13–0.85, S 0.44–0.72). Only
  // the teal ramp is remapped (by delta, same reasoning as dragon/pegasus,
  // since its 7 colors span H 171–199); the white passes through untouched,
  // the same protected-accent pattern as T-Rex's belly.

      },
      rose: {
        swatch: '#f44687',
        map: {
          '#fdd87c': '#fd7ca1',
          '#fbd375': '#fb759d',

  function hexToRgb(hex) {
    var v = parseInt(hex.slice(1), 16);
    return { r: (v >> 16) & 255, g: (v >> 8) & 255, b: v & 255 };
  }

  // src+variant -> data URL of the recolored sprite. Populated lazily the
  // first time a given (pose art, variant) pair is needed.
  var recolorCache = {};

  function requestRecolor(src, variant, map, onReady) {
    var key = src + '|' + variant;
    var img = new Image();
    img.onload = function () {
      var canvas = document.createElement('canvas');
      canvas.width = img.naturalWidth;
      canvas.height = img.naturalHeight;
      var ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var px = imageData.data;
      var lut = {};
      Object.keys(map).forEach(function (fromHex) {
        var from = hexToRgb(fromHex);
        lut[from.r + ',' + from.g + ',' + from.b] = hexToRgb(map[fromHex]);
      });
      for (var i = 0; i < px.length; i += 4) {
        if (px[i + 3] === 0) continue; // leave transparent background alone
        var to = lut[px[i] + ',' + px[i + 1] + ',' + px[i + 2]];
        if (to) {
          px[i] = to.r;
          px[i + 1] = to.g;
          px[i + 2] = to.b;
        }
      }
      ctx.putImageData(imageData, 0, 0);
      recolorCache[key] = canvas.toDataURL('image/png');
      onReady(recolorCache[key]);
    };
    img.src = src;
  }

  // Returns what the <img> should actually show for this pose: the plain
  // pose art for 'base' (or a species with no variants defined), or the
  // cached recolor once it's ready. Kicks off the (async) recolor on a
  // cache miss and falls back to the base art until it resolves, at which
  // point the onReady callback re-renders to pick up the cached result.
  function resolveDisplaySrc(species, src) {
    var variants = COLOR_VARIANTS[species];
    var variant = state.colorVariant;
    if (!src || !variants || !variant || variant === 'base') return src;
    var entry = variants[variant];
    if (!entry) return src;
    var key = src + '|' + variant;
    if (recolorCache[key]) return recolorCache[key];
    requestRecolor(src, variant, entry.map, function () { render(); });
    return src;
  }

  var speciesPicker = document.getElementById('species-picker');
  var appBody = document.getElementById('app-body');
  var stage = document.getElementById('stage');
  var petSprite = document.getElementById('pet-sprite');
  var statusText = document.getElementById('status-text');
  var nameDisplay = document.getElementById('pet-name-display');
  var btnFeed = document.getElementById('btn-feed');
  var btnPlay = document.getElementById('btn-play');
  var btnClean = document.getElementById('btn-clean');
  var btnSleep = document.getElementById('btn-sleep');
  var sleepLabel = document.getElementById('sleep-label');
  var renameToggle = document.getElementById('rename-toggle');
  var renameForm = document.getElementById('rename-form');
  var renameInput = document.getElementById('rename-input');
  var speciesButtons = Array.prototype.slice.call(document.querySelectorAll('.species-btn'));
  var variantRow = document.getElementById('variant-row');

  var state = loadState();

  // Transient, so deliberately not part of the persisted state — reopening
  // the app shouldn't resume a half-finished bath.
  var actionPose = null;
  var actionPoseTimer = null;

  // `?pose=sleep` pins a pose so new art can be checked without having to
  // starve the pet into the matching mood first.
  var posePreview = (function () {
    var match = /[?&]pose=([a-z]+)/.exec(window.location.search);
    return match && POSE_FALLBACK.hasOwnProperty(match[1]) ? match[1] : null;
  })();

  // Builds the swatch row once per species (rebuilding only when the
  // species changes), then just updates which button reads as active.
  function renderVariantPicker() {
    var variants = COLOR_VARIANTS[state.species];
    if (!variants) {
      variantRow.classList.remove('visible');
      variantRow.innerHTML = '';
      variantRow.dataset.builtFor = '';
      return;
    }
    variantRow.classList.add('visible');
    if (variantRow.dataset.builtFor !== state.species) {
      variantRow.innerHTML = '';
      var baseBtn = document.createElement('button');
      baseBtn.type = 'button';
      baseBtn.className = 'variant-btn variant-base';
      baseBtn.dataset.variant = 'base';
      baseBtn.title = 'Original colors';
      baseBtn.textContent = '↺';
      variantRow.appendChild(baseBtn);
      Object.keys(variants).forEach(function (name) {
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'variant-btn';
        btn.dataset.variant = name;
        btn.style.setProperty('--swatch', variants[name].swatch);
        btn.title = name;
        variantRow.appendChild(btn);
      });
      variantRow.dataset.builtFor = state.species;
      Array.prototype.slice.call(variantRow.querySelectorAll('.variant-btn')).forEach(function (btn) {
        btn.addEventListener('click', function () {
          state.colorVariant = btn.dataset.variant;
          saveState();
          render();
        });
      });
    }
    Array.prototype.slice.call(variantRow.querySelectorAll('.variant-btn')).forEach(function (btn) {
      btn.classList.toggle('active', (state.colorVariant || 'base') === btn.dataset.variant);
    });
  }

  function showActionPose(pose) {
    actionPose = pose;
    clearTimeout(actionPoseTimer);
    actionPoseTimer = setTimeout(function () {
      actionPose = null;
      render();
    }, ACTION_POSE_MS);
  }

  // True 64x64 art needs nearest-neighbour upscaling or it turns to mush;
  // the legacy 640px stills need the opposite. Decide per file on load.
  petSprite.addEventListener('load', function () {
    petSprite.classList.toggle('pixel-art', petSprite.naturalWidth > 0 && petSprite.naturalWidth <= 128);
  });

  function render() {
    if (!state.species) {
      speciesPicker.style.display = 'block';
      appBody.style.display = 'none';
      return;
    }
    speciesPicker.style.display = 'none';
    appBody.style.display = 'block';

    var mood = getMood(state);
    // An action pose (eating, bathing) outranks the mood pose while it holds.
    var wanted = posePreview || actionPose || MOOD_POSES[mood] || 'idle';
    // Pin the matching mood too when previewing, otherwise the mood-keyed
    // fallback styling won't match the pose being previewed.
    if (posePreview && POSE_MOODS[posePreview]) mood = POSE_MOODS[posePreview];
    var art = resolvePose(state.species, wanted);

    stage.className = 'stage mood-' + mood + ' species-' + state.species +
      ' pose-' + art.pose + (art.exact ? '' : ' pose-fallback') +
      (state.cleanliness < 35 ? ' dirty' : '');

    var displaySrc = resolveDisplaySrc(state.species, art.src);
    if (displaySrc && petSprite.getAttribute('src') !== displaySrc) {
      petSprite.src = displaySrc;
    }
    if (art.src) {
      petSprite.alt = (state.name || 'Your pet') + ' the ' + state.species +
        POSE_ALT[art.pose];
    }

    speciesButtons.forEach(function (btn) {
      btn.classList.toggle('active', btn.dataset.species === state.species);
    });

    renderVariantPicker();

    document.getElementById('bar-hunger').style.width = state.hunger + '%';
    document.getElementById('bar-happiness').style.width = state.happiness + '%';
    document.getElementById('bar-energy').style.width = state.energy + '%';
    document.getElementById('bar-cleanliness').style.width = state.cleanliness + '%';

    document.getElementById('val-hunger').textContent = Math.round(state.hunger);
    document.getElementById('val-happiness').textContent = Math.round(state.happiness);
    document.getElementById('val-energy').textContent = Math.round(state.energy);
    document.getElementById('val-cleanliness').textContent = Math.round(state.cleanliness);

    statusText.textContent = STATUS_MESSAGES[mood];
    nameDisplay.textContent = state.name || 'Widget';

    sleepLabel.textContent = state.sleeping ? 'Wake' : 'Sleep';
    btnFeed.disabled = state.sleeping;
    btnPlay.disabled = state.sleeping;
    btnClean.disabled = state.sleeping;
  }

  function tick() {
    applyDecay(state);
    saveState();
    render();
  }

  function flash() {
    var visual = state.species === 'blob' ? document.getElementById('pet-svg') : petSprite;
    visual.classList.remove('action-flash');
    // force reflow so the animation can restart on repeated taps
    void visual.offsetWidth;
    visual.classList.add('action-flash');
  }

  function doAction(action, fn) {
    return function () {
      applyDecay(state);
      fn();
      if (ACTION_POSES[action]) showActionPose(ACTION_POSES[action]);
      saveState();
      render();
      flash();
    };
  }

  btnFeed.addEventListener('click', doAction('feed', function () {
    state.hunger = clamp(state.hunger + 25);
  }));

  btnPlay.addEventListener('click', doAction('play', function () {
    state.happiness = clamp(state.happiness + 20);
    state.energy = clamp(state.energy - 10);
    state.hunger = clamp(state.hunger - 5);
  }));

  btnClean.addEventListener('click', doAction('clean', function () {
    state.cleanliness = 100;
  }));

  // Sleep has no action pose of its own — toggling it changes the mood, and
  // the sleep pose comes from there and holds until the pet wakes.
  btnSleep.addEventListener('click', doAction('sleep', function () {
    state.sleeping = !state.sleeping;
    actionPose = null;
    clearTimeout(actionPoseTimer);
  }));

  renameToggle.addEventListener('click', function () {
    renameInput.value = state.name || '';
    renameForm.classList.toggle('visible');
    if (renameForm.classList.contains('visible')) renameInput.focus();
  });

  renameForm.addEventListener('submit', function (e) {
    e.preventDefault();
    var trimmed = renameInput.value.trim();
    state.name = trimmed || null;
    saveState();
    render();
    renameForm.classList.remove('visible');
  });

  speciesButtons.forEach(function (btn) {
    btn.addEventListener('click', function () {
      // One-time pick: species is locked in once chosen. A future unlock
      // mechanism (see SPEC.md) can lift this guard to allow re-picking.
      if (state.species) return;
      state.species = btn.dataset.species;
      saveState();
      render();
      flash();
    });
  });

  tick();
  setInterval(tick, 15000);
})();
</script>
